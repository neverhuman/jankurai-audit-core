[package]
name = "jankurai"
version = "1.7.6"
edition = "2021"
description = "Agent-native repository audit CLI and standard."
license = "MIT"
repository = "https://github.com/neverhuman/jankurai-core"
homepage = "https://github.com/neverhuman/jankurai"
readme = "README.md"
keywords = ["agent", "audit", "cli", "governance", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
cargo_metadata = "0.19"
globset = "0.4"
ignore = "0.4"
jsonschema = { version = "=0.55.1", default-features = false, features = ["idna"] }
jankurai-audit-analyzers = { git = "https://github.com/neverhuman/jankurai-tools-analyzers.git", rev = "1eacd85ab8b63c4f53db9dbc3d419c919b8ee7c3", package = "jankurai-audit-analyzers", version = "0.1.0" }
jankurai-audit-dedup = { git = "https://github.com/neverhuman/jankurai-tools-dedup.git", tag = "ci-602b608c59690020eb66a2069f67d33a75b481f1", package = "jankurai-audit-dedup", version = "0.1.0" }
jankurai-audit-kernel = { git = "https://git.jeryu.ai/git/root/jankurai-tools-kernel", tag = "ci-65e8344ff3718ede0e05c55ee27003d9673c17f0", package = "jankurai-audit-kernel", version = "0.1.0" }
jankurai-fleet = { git = "https://github.com/neverhuman/jankurai-tools-fleet.git", tag = "ci-668532cd06f87aec6b677ab061405e51871e57b8", package = "jankurai-fleet", version = "0.1.0" }
jankurai-guard = { git = "https://github.com/neverhuman/jankurai-tools-guard.git", tag = "ci-ac11dec26907b986c62b1112fc6e781e1e2894c3", package = "jankurai-guard", version = "0.1.0", default-features = false }
jankurai-proofbind = { git = "https://github.com/neverhuman/jankurai-tools-proof.git", rev = "c861123eeea0a57763f7f21587092e876691f16b", package = "jankurai-proofbind", version = "0.8.0" }
jankurai-proofmark = { git = "https://github.com/neverhuman/jankurai-tools-proof.git", rev = "c861123eeea0a57763f7f21587092e876691f16b", package = "jankurai-proofmark", version = "0.8.0" }
once_cell = "1.21"
rayon = "1.11"
regex = "1.12"
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
semver = "1.0"
toml = "0.9"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
walkdir = "2.5"
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
guard-fuse = ["jankurai-guard/fuse"]

[dev-dependencies]
tempfile = "3.23"
