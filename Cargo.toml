[workspace]
members = [
  "crates/jankurai",
]
resolver = "2"

# Keep one qualified kernel identity across the selected component graph.
# The `www.github.com` host is deliberate: Cargo refuses a [patch] whose source
# URL equals the URL it patches, so the same repository is named by its `www`
# alias. Both name the same repository, and each patch must pin the same commit
# as the dependency line in crates/jankurai/Cargo.toml.
[patch."https://github.com/neverhuman/jankurai-tools-kernel.git"]
jankurai-audit-kernel = { git = "https://www.github.com/neverhuman/jankurai-tools-kernel.git", rev = "bc13c32452eb31a4a9630ea2ea22c1ecdb8457f9" }

[patch."https://github.com/neverhuman/jankurai-tools-dedup.git"]
jankurai-audit-dedup = { git = "https://www.github.com/neverhuman/jankurai-tools-dedup.git", rev = "602b608c59690020eb66a2069f67d33a75b481f1" }
