[workspace]
members = [
  "crates/jankurai",
]
resolver = "2"

# Keep one qualified kernel identity across the selected component graph.
# Redirect transitive historical GitHub sources to the authoritative forge.
# The direct dependency uses the same canonical forge route. Hub fusion
# patches canonical and mirror routes to its locked local member source.
[patch."https://github.com/neverhuman/jankurai-tools-kernel.git"]
jankurai-audit-kernel = { git = "https://git.neverhuman.org/git/root/jankurai-tools-kernel.git", rev = "bc246e57a7dd784589c250ff7d7237ce7691864e" }

[patch."https://github.com/neverhuman/jankurai-tools-dedup.git"]
jankurai-audit-dedup = { git = "https://www.github.com/neverhuman/jankurai-tools-dedup.git", rev = "602b608c59690020eb66a2069f67d33a75b481f1" }
